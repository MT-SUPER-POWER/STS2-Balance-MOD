name: Release Mod

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  MOD_NAME: Sts2BalanceMod
  GODOT_VERSION: 4.5.1

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Changelog
        id: changelog_reader
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: return require('./.github/scripts/extract-changelog.js')({ context })

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Setup Godot Mono and Export Templates
        run: bash .github/scripts/setup-godot.sh ${{ env.GODOT_VERSION }}

      - name: Update version in mod json
        run: node .github/scripts/update-mod-version.js ${{ github.ref_name }}

      - name: Compile & Publish
        run: dotnet publish -c Release /p:ContinuousIntegrationBuild=true /p:SkipGodotExport=true

      - name: Export PCK
        continue-on-error: true
        run: ./godot --headless --export-pack "Sts2BalanceMod" "$(pwd)/dist/Sts2BalanceMod/Sts2BalanceMod.pck" 2>&1

      - name: Verify and Package
        run: bash .github/scripts/package-release.sh ${{ github.ref_name }}

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ env.MOD_NAME }} ${{ github.ref_name }}
          body: ${{ steps.changelog_reader.outputs.result }}
          files: dist/Sts2BalanceMod-${{ github.ref_name }}.zip
          generate_release_notes: false
          make_latest: true
