name: Release Notes

# 推送 Tag 时自动创建 Release，并从 CHANGELOG.md 写入对应版本说明。
# Mod 安装包由本机 Hooks/release.ps1 构建后上传。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  MOD_NAME: Sts2BalanceMod

jobs:
  release-notes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<ver>[0-9]+(\.[0-9]+)+)$') {
            throw "Tag 格式应为 v0.0.4 或 v0.0.4.1，当前: $tag"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($Matches['ver'])" >> $env:GITHUB_OUTPUT

      - name: Extract changelog
        shell: pwsh
        run: |
          ./Hooks/extract-changelog.ps1 `
            -Version '${{ steps.version.outputs.version }}' `
            -OutputPath release_notes.md
          Write-Host "----- Release Notes Preview -----"
          Get-Content release_notes.md
          Write-Host "---------------------------------"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ env.MOD_NAME }} ${{ steps.version.outputs.tag }}
          body_path: release_notes.md
          generate_release_notes: false
          make_latest: true
