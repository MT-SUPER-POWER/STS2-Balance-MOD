name: Publish Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  MOD_NAME: Sts2BalanceMod

jobs:
  release:
    # NOTE: 在本机 self-hosted runner 上构建，复用已配置好的 STS2 / Godot 环境，无需额外 Secrets
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<ver>\d+\.\d+\.\d+)$') {
            throw "Tag 格式应为 v0.0.4，当前: $tag"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($Matches['ver'])" >> $env:GITHUB_OUTPUT

      - name: Extract changelog for release
        id: changelog
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $content = Get-Content -Path 'CHANGELOG.md' -Raw -Encoding UTF8
          $escaped = [regex]::Escape($version)

          $patterns = @(
            "(?ms)^# v$escaped\s*\r?\n(.*?)(?=^# v|\z)",
            "(?ms)^# V $escaped\s*\r?\n(.*?)(?=^# [vV]|\z)",
            "(?ms)^## \[$escaped\].*?\r?\n(.*?)(?=^## \[|^# [vV]|\z)"
          )

          $notes = $null
          foreach ($pattern in $patterns) {
            $match = [regex]::Match($content, $pattern)
            if ($match.Success) {
              $notes = $match.Groups[1].Value.Trim()
              break
            }
          }

          if (-not $notes) {
            Write-Warning "CHANGELOG.md 中未找到 # v$version 段落"
            $notes = "详见 [CHANGELOG.md](CHANGELOG.md)"
          }

          $notesPath = "$env:GITHUB_WORKSPACE\release_notes.md"
          $notes | Out-File -FilePath $notesPath -Encoding utf8NoBOM
          "path=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Sync mod version
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $jsonPath = "Sts2BalanceMod.json"
          $json = Get-Content $jsonPath -Raw
          $json = $json -replace '"version"\s*:\s*"[^"]*"', "`"version`": `"v$version`""
          $json | Set-Content $jsonPath -Encoding utf8NoBOM -NoNewline

      - name: Build and package
        id: package
        shell: pwsh
        run: |
          $zip = & "$env:GITHUB_WORKSPACE\Hooks\package-release.ps1" -Version '${{ steps.version.outputs.version }}'
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ env.MOD_NAME }} ${{ steps.version.outputs.tag }}
          body_path: ${{ steps.changelog.outputs.path }}
          files: ${{ steps.package.outputs.zip }}
          generate_release_notes: false
