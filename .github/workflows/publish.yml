name: Release Notes

# 推送 Tag 时自动创建 Release，并从 CHANGELOG.md 写入对应版本说明。
# zip 附件由本机 Hooks/release.ps1 构建后上传。

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  MOD_NAME: Sts2BalanceMod

jobs:
  release-notes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v([0-9]+(\.[0-9]+)+)$ ]]; then
            echo "Tag 格式无效: $TAG（应为 v0.0.4 或 v0.0.4.1）"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog
        id: changelog
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $content = Get-Content -Path 'CHANGELOG.md' -Raw -Encoding UTF8
          $escaped = [regex]::Escape($version)

          $patterns = @(
            "(?ms)^# v$escaped\s*\r?\n(.*?)(?=^# v|\z)",
            "(?ms)^# V $escaped\s*\r?\n(.*?)(?=^# [vV]|\z)",
            "(?ms)^## \[$escaped\].*?\r?\n(.*?)(?=^## \[|^# [vV]|\z)"
          )

          $notes = $null
          foreach ($pattern in $patterns) {
            $match = [regex]::Match($content, $pattern)
            if ($match.Success) {
              $notes = $match.Groups[1].Value.Trim()
              break
            }
          }

          if (-not $notes) {
            Write-Warning "CHANGELOG.md 中未找到 # v$version 段落"
            $notes = "详见 [CHANGELOG.md](CHANGELOG.md)"
          }

          $notesPath = "$env:GITHUB_WORKSPACE/release_notes.md"
          $notes | Out-File -FilePath $notesPath -Encoding utf8NoBOM
          "path=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ env.MOD_NAME }} ${{ steps.version.outputs.tag }}
          body_path: ${{ steps.changelog.outputs.path }}
          generate_release_notes: false
