name: Code Check & Test

on:
  push:
    branches: [main]
    paths:
      - '**.cs'
      - '**.csproj'
      - '.editorconfig'
      - 'tests/**'
      - '.github/workflows/code-check.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.cs'
      - '**.csproj'
      - '.editorconfig'
      - 'tests/**'
      - '.github/workflows/code-check.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  code-check:
    name: Code Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        # 与 release 一致：CI 无本机 GodotPath，跳过 PCK 导出
        run: dotnet restore /p:ContinuousIntegrationBuild=true /p:SkipGodotExport=true

      - name: Build project
        # lint CI 需要编译校验，但不安装 Godot；参考 release 的 SkipGodotExport
        run: dotnet build --no-restore -c Debug /p:ContinuousIntegrationBuild=true /p:SkipGodotExport=true

      - name: Run dotnet format check
        id: format
        run: |
          set -o pipefail
          # format 不接受 /p: MSBuild 属性；restore/build 已带 SkipGodotExport
          dotnet format \
            --verify-no-changes \
            --severity info \
            --no-restore \
            2>&1 | tee format-output.txt

      - name: Run C# xUnit Tests
        run: dotnet test --no-build -c Debug /p:ContinuousIntegrationBuild=true /p:SkipGodotExport=true

      - name: Run PowerShell Tests
        shell: pwsh
        run: |
          $testFiles = Get-ChildItem -Path tests/*.Tests.ps1 -ErrorAction SilentlyContinue
          if ($testFiles) {
            foreach ($file in $testFiles) {
              Write-Host "Running $($file.Name)..."
              & $file.FullName
            }
          } else {
            Write-Host "No test files found."
          }

      - name: Comment on PR if format issues found
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('format-output.txt')) {
              const output = fs.readFileSync('format-output.txt', 'utf8');
              const body = [
                '## 🎨 代码格式检查未通过',
                '',
                '检测到代码格式问题，请在本地运行以下命令修复：',
                '```bash',
                'dotnet format',
                '```',
                '',
                '<details><summary>详细输出</summary>',
                '',
                '```',
                output.slice(0, 3000),
                '```',
                '</details>'
              ].join('\n');

              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
