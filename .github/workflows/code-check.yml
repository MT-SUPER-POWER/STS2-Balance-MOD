name: Code Check

on:
  push:
    branches: [main]
    paths:
      - "**.cs"
      - "**.csproj"
      - "**.md"
      - ".editorconfig"
      - ".editorconfig-checker.json"
      - ".markdownlint-cli2.jsonc"
      - ".prettierrc.json"
      - ".prettierignore"
      - "lint-staged.config.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/**"
      - ".github/scripts/**"
  pull_request:
    branches: [main]
    paths:
      - "**.cs"
      - "**.csproj"
      - "**.md"
      - ".editorconfig"
      - ".editorconfig-checker.json"
      - ".markdownlint-cli2.jsonc"
      - ".prettierrc.json"
      - ".prettierignore"
      - "lint-staged.config.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/**"
      - ".github/scripts/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-check:
    name: Code Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        # 与 release 一致：CI 无本机 GodotPath，跳过 PCK 导出
        run: dotnet restore /p:ContinuousIntegrationBuild=true /p:SkipGodotExport=true

      - name: Build project
        run: dotnet build --no-restore -c Debug /p:ContinuousIntegrationBuild=true /p:SkipGodotExport=true

      - name: Run code & format check
        id: check
        run: |
          set -o pipefail
          pnpm run check 2>&1 | tee check-output.txt

      - name: Save report files on failure
        if: failure() && github.event_name == 'pull_request'
        run: |
          mkdir -p report
          echo "${{ github.event.pull_request.number }}" > report/pr_number.txt
          cp check-output.txt report/check-output.txt

      - name: Upload check report artifact
        if: failure() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: check-report
          path: report/
          retention-days: 1
