name: Lint (dotnet format)

on:
  pull_request:
    branches: [main]
    paths:
      - '**.cs'
      - '**.csproj'
      - '.editorconfig'

# 只需读权限即可，如需自动 commit 修复则改为 write
permissions:
  contents: read
  pull-requests: write   # 用于在 PR 上写评论（可选）

jobs:
  format-check:
    name: Check C# Code Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        # --locked-mode 确保使用 packages.lock.json（如有）；
        # 这里跳过本地游戏 dll 路径检查，CI 环境下游戏未安装是预期行为
        run: dotnet restore /p:ContinuousIntegrationBuild=true

      - name: Run dotnet format (verify only)
        id: format
        run: |
          dotnet format \
            --verify-no-changes \
            --severity info \
            /p:ContinuousIntegrationBuild=true \
            2>&1 | tee format-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Comment on PR if format issues found
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('format-output.txt', 'utf8');
            const body = [
              '## 🎨 代码格式检查未通过',
              '',
              '检测到代码格式问题，请在本地运行以下命令修复：',
              '```bash',
              'dotnet format',
              '```',
              '',
              '<details><summary>详细输出</summary>',
              '',
              '```',
              output.slice(0, 3000),
              '```',
              '</details>'
            ].join('\n');

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
